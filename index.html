<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wave Executor - IP Sorgu</title>
    <link rel="icon" href="https://github.com/user-attachments/assets/2fc59ca0-9af2-4082-b110-0349173909dd">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #090b10;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.16) 0%, transparent 52%),
                radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.1) 0%, transparent 42%);
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.22);
            border-radius: 24px;
            padding: 44px 48px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75), 0 0 35px rgba(56, 189, 248, 0.1);
            max-width: 460px;
            width: 100%;
            transition: border-color 0.25s ease, transform 0.25s ease;
        }

        .card:hover {
            border-color: rgba(56, 189, 248, 0.45);
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 30px;
        }

        .logo-container img {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        .brand-name {
            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .ip-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #94a3b8;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .ip-box {
            background: rgba(9, 11, 16, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 24px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .ip-box:hover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.06);
        }

        .ip-address {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.65rem;
            font-weight: 700;
            color: #38bdf8;
            word-break: break-all;
        }

        .copy-hint {
            display: block;
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 8px;
        }

        .country-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.04);
            padding: 10px 20px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .flag-img {
            width: 28px;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
        }

        .country-name {
            font-size: 0.98rem;
            font-weight: 600;
            color: #e2e8f0;
        }

        .loading {
            opacity: 0.55;
            animation: pulse 1.4s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-container">
            <img src="https://github.com/user-attachments/assets/2fc59ca0-9af2-4082-b110-0349173909dd" alt="Wave Executor Logo">
            <span class="brand-name">Wave Executor</span>
        </div>

        <div class="ip-label">IP Adresiniz</div>
        <div class="ip-box" onclick="copyIP()" title="Kopyalamak için tıklayın">
            <div class="ip-address loading" id="ip-text">Yükleniyor...</div>
            <span class="copy-hint" id="copy-status">Kopyalamak için tıklayın</span>
        </div>

        <div class="country-container">
            <img id="country-flag" class="flag-img" src="" alt="Ülke Bayrağı" style="display: none;">
            <span class="country-name" id="country-text">Konum tespit ediliyor...</span>
        </div>
    </div>

    <script>
        async function loadIPInfo() {
            const ipEl = document.getElementById('ip-text');
            const flagEl = document.getElementById('country-flag');
            const countryEl = document.getElementById('country-text');

            try {
                const res = await fetch('https://ipwho.is/');
                const data = await res.json();

                ipEl.classList.remove('loading');

                if (data && data.success) {
                    ipEl.textContent = data.ip || 'Bulunamadı';

                    if (data.country_code) {
                        const code = data.country_code.toLowerCase();
                        flagEl.src = `https://flagcdn.com/w80/${code}.png`;
                        flagEl.alt = `${data.country} Bayrağı`;
                        flagEl.style.display = 'block';
                    }

                    countryEl.textContent = data.country || 'Ülke Bilinmiyor';
                } else {
                    ipEl.textContent = 'Alınamadı';
                    countryEl.textContent = 'Konum bulunamadı';
                }
            } catch (error) {
                ipEl.classList.remove('loading');
                ipEl.textContent = 'Bağlantı Hatası';
                countryEl.textContent = 'Servis engellenmiş olabilir (Re reklam engelleyiciyi kontrol edin)';
            }
        }

        function copyIP() {
            const ipText = document.getElementById('ip-text').textContent.trim();
            if (ipText && !['Yükleniyor...', 'Alınamadı', 'Bağlantı Hatası'].includes(ipText)) {
                navigator.clipboard.writeText(ipText);
                const statusEl = document.getElementById('copy-status');
                statusEl.textContent = 'Kopyalandı!';
                statusEl.style.color = '#38bdf8';
                setTimeout(() => {
                    statusEl.textContent = 'Kopyalamak için tıklayın';
                    statusEl.style.color = '#64748b';
                }, 2000);
            }
        }

        loadIPInfo();
    </script>
</body>
</html>
